<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lambda Web Shortener</title>
  <style>
    :root { --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #6b7280; --line: #e5e7eb; --accent: #3f6ae0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
    .sub { color: var(--muted); margin: 0 0 28px; }
    .sub code { background: var(--line); padding: 1px 6px; border-radius: 4px; font-size: 13px; }
    form { display: grid; grid-template-columns: 1fr 160px auto; gap: 8px; margin-bottom: 28px; }
    input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--card); }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: #b42318; margin: -18px 0 20px; min-height: 1.5em; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    li { display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    li img { width: 72px; height: 72px; border-radius: 6px; background: #fff; }
    .short { font-weight: 600; text-decoration: none; color: var(--accent); word-break: break-all; }
    .target { color: var(--muted); font-size: 13px; word-break: break-all; }
    .clicks { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); font-size: 13px; }
    .clicks b { display: block; font-size: 20px; color: var(--ink); }
    .empty { color: var(--muted); text-align: center; padding: 32px 0; }
    footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
    @media (max-width: 600px) { form { grid-template-columns: 1fr; } li { grid-template-columns: 56px 1fr; } .clicks { grid-column: 2; text-align: left; } .clicks b { display: inline; margin-right: 6px; } }
  </style>
</head>
<body>
<main>
  <h1>Lambda Web Shortener</h1>
  <p class="sub">An Express app served by a single Lambda Web Function. Links live in DynamoDB, QR codes in S3. Served from <code id="region">…</code>.</p>

  <form id="create">
    <input id="url" type="url" placeholder="https://example.com/a/very/long/path" required>
    <input id="slug" type="text" placeholder="custom slug (optional)" pattern="[A-Za-z0-9_-]{3,32}">
    <button id="submit" type="submit">Shorten</button>
  </form>
  <div class="error" id="error"></div>

  <ul id="links"></ul>
  <footer>Refresh to see click counts update after following a short link.</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);

  async function load() {
    const { links } = await (await fetch("/api/links")).json();
    const list = $("links");
    list.innerHTML = "";
    if (!links.length) {
      list.innerHTML = '<li class="empty" style="display:block">No links yet. Shorten one above.</li>';
      return;
    }
    for (const link of links) {
      const li = document.createElement("li");
      li.innerHTML = `
        <img src="${link.qr}" alt="QR code for ${link.slug}">
        <div>
          <a class="short" href="/${link.slug}" target="_blank" rel="noopener">${location.host}/${link.slug}</a>
          <div class="target">${link.url}</div>
        </div>
        <div class="clicks"><b>${link.clicks}</b>clicks</div>`;
      list.appendChild(li);
    }
  }

  $("create").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("error").textContent = "";
    $("submit").disabled = true;
    const body = { url: $("url").value.trim() };
    if ($("slug").value.trim()) body.slug = $("slug").value.trim();
    const response = await fetch("/api/links", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await response.json();
    $("submit").disabled = false;
    if (!response.ok) { $("error").textContent = data.error || response.statusText; return; }
    $("url").value = ""; $("slug").value = "";
    await load();
  });

  fetch("/healthz").then((r) => r.json()).then((h) => { $("region").textContent = h.region || "unknown region"; });
  load();
</script>
</body>
</html>
